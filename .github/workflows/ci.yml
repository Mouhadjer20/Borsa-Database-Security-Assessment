name: CI — BorsaTrust Backend & Frontend

on:
  push:
    branches: ["main", "fix/**", "feat/**", "hotfix/**"]
  pull_request:
    branches: ["main"]

jobs:
  # =========================================================================
  # 1. Backend — pytest on multiple Python versions
  # =========================================================================
  backend-tests:
    name: "Backend tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip & install build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools

      - name: Install backend dependencies
        run: |
          pip install --no-cache-dir -r application/backend/requirements.txt

      - name: Run pytest
        working-directory: application/backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --tb=short 2>&1 | tee /tmp/pytest_out.txt || {
            echo "## ❌ Pytest Failure Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/pytest_out.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  # =========================================================================
  # 2. Backend — code quality (import check, no broken imports)
  # =========================================================================
  backend-lint:
    name: "Backend lint & import check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r application/backend/requirements.txt

      - name: Verify app module imports cleanly
        working-directory: application/backend
        env:
          PYTHONPATH: .
        run: |
          python -c "from app.main import app; print('App imports OK')"
          python -c "from app.core.config import get_settings; s=get_settings(); print('Settings OK')"
          python -c "from app.core.security import hash_password, verify_password; h=hash_password('test'); assert verify_password('test', h); print('Security & Bcrypt OK')"

      - name: Check no lab module remains
        working-directory: application/backend
        run: |
          python -c "
          try:
              import app.api.lab
              raise SystemExit('FAIL: app.api.lab still exists!')
          except (ImportError, ModuleNotFoundError):
              print('OK: lab module correctly removed')
          "

  # =========================================================================
  # 3. Frontend — build with Vite
  # =========================================================================
  frontend-build:
    name: "Frontend build (Node.js ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: application/frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend (Vite)
        working-directory: application/frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Verify dist output exists
        working-directory: application/frontend
        run: |
          test -f dist/index.html && echo "dist/index.html OK" || exit 1
          test -d dist/assets    && echo "dist/assets/ OK"    || exit 1

  # =========================================================================
  # 4. Deploy script syntax validation
  # =========================================================================
  deploy-scripts-lint:
    name: "Deploy scripts syntax check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all bash deploy scripts
        run: |
          set -e
          for script in \
            deploy/vm1-app-server/setup.sh \
            deploy/vm1-app-server/deploy.sh \
            deploy/vm2-db-server/setup.sh \
            deploy/vm2-db-server/backup.sh \
            deploy/check.sh; do
            bash -n "$script" && echo "OK: $script" || { echo "FAIL: $script"; exit 1; }
          done

  # =========================================================================
  # 5. Database SQL syntax check (psql --dry-run via pg client)
  # =========================================================================
  db-sql-lint:
    name: "SQL schema & seed syntax check"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: borsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d borsa_test \
            -f database/schema-reference/expected-schema.sql
          echo "Schema applied OK"

      - name: Apply seed data
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d borsa_test \
            -f database/seed-data.sql
          echo "Seed data applied OK"

      - name: Verify seeded rows
        env:
          PGPASSWORD: test
        run: |
          COUNT=$(psql -h localhost -U postgres -d borsa_test -t -c \
            "SELECT COUNT(*) FROM app_users;" | tr -d ' ')
          echo "app_users count: $COUNT"
          [ "$COUNT" -eq 5 ] || { echo "Expected 5 users, got $COUNT"; exit 1; }
