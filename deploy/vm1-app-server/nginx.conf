# =============================================================================
# BorsaTrust — Nginx Site Configuration
# =============================================================================
# Installed to : /etc/nginx/sites-available/borsa
# Placeholders __APP_DIR__ and __APP_PORT__ are replaced by setup.sh
# =============================================================================

upstream borsa_backend {
    # FastAPI uvicorn — localhost only
    server 127.0.0.1:__APP_PORT__ fail_timeout=10s max_fails=3;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;                # accept any hostname / IP

    # ----------------------------------------------------------------------- #
    # Security headers
    # ----------------------------------------------------------------------- #
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin" always;

    # ----------------------------------------------------------------------- #
    # API — proxy to FastAPI backend
    # ----------------------------------------------------------------------- #
    location /api/ {
        proxy_pass         http://borsa_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Disable buffering for SSE / streaming responses
        proxy_buffering off;
    }

    # ----------------------------------------------------------------------- #
    # React SPA — serve static build, fallback to index.html (client routing)
    # ----------------------------------------------------------------------- #
    root __APP_DIR__/application/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive cache for Vite hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------------------- #
    # Gzip compression
    # ----------------------------------------------------------------------- #
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # ----------------------------------------------------------------------- #
    # Request size limit (prevent large payload attacks)
    # ----------------------------------------------------------------------- #
    client_max_body_size 2M;

    # ----------------------------------------------------------------------- #
    # Logging
    # ----------------------------------------------------------------------- #
    access_log /var/log/nginx/borsa-access.log;
    error_log  /var/log/nginx/borsa-error.log;
}

